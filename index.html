<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriorityVoice Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", sans-serif;
    background: #0d1117; color: #e6edf3;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 32px; width: 100%; max-width: 520px;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p.sub { margin: 0 0 24px; color: #8b949e; font-size: 13px; }
  label { display: block; font-size: 13px; color: #8b949e; margin: 16px 0 6px; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
    font-family: inherit; font-size: 14px;
  }
  textarea { min-height: 90px; resize: vertical; font-family: monospace; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 20px 0; }
  .switch { position: relative; width: 46px; height: 26px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #30363d;
    border-radius: 26px; cursor: pointer; transition: .2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 20px; width: 20px;
    left: 3px; top: 3px; background: #e6edf3; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: #238636; }
  input:checked + .slider::before { transform: translateX(20px); }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: #238636; color: white; font-weight: 600;
    font-size: 14px; cursor: pointer; margin-top: 8px;
  }
  button:hover { background: #2ea043; }
  .error { color: #f85149; font-size: 13px; margin-top: 12px; }
  .logout { display: inline-block; margin-top: 16px; color: #8b949e; font-size: 12px; text-decoration: none; }
  .logout:hover { color: #e6edf3; }
  .status { font-size: 13px; color: #8b949e; }
  .status.on { color: #3fb950; }
  .status.off { color: #f85149; }
</style>
</head>
<body>
<div class="card">
  {% if not logged %}
    <h1>PriorityVoice</h1>
    <p class="sub">Inserisci la password per accedere.</p>
    <form method="POST" action="/login">
      <label>Password</label>
      <input type="password" name="password" autofocus>
      <button type="submit">Accedi</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
  {% else %}
    <h1>PriorityVoice</h1>
    <p class="sub">
      Stato bot:
      <span class="status {{ 'on' if cfg.enabled else 'off' }}">
        {{ 'ATTIVO' if cfg.enabled else 'DISATTIVATO' }}
      </span>
    </p>
    <form method="POST" action="/save">
      <div class="row">
        <div>
          <div style="font-size:14px;">Bot attivo</div>
          <div style="font-size:12px; color:#8b949e;">Se spento, il bot ignora tutti gli eventi vocali.</div>
        </div>
        <label class="switch">
          <input type="checkbox" name="enabled" {% if cfg.enabled %}checked{% endif %}>
          <span class="slider"></span>
        </label>
      </div>

      <label>ID utente prioritario</label>
      <input type="text" name="priority_user_id" value="{{ cfg.priority_user_id }}">

      <label>ID utenti bloccati (uno per riga)</label>
      <textarea name="blocked_user_ids">{% for uid in cfg.blocked_user_ids %}{{ uid }}
{% endfor %}</textarea>

      <button type="submit">Salva</button>
    </form>
    <a class="logout" href="/logout">Esci</a>
  {% endif %}
</div>
</body>
</html>
